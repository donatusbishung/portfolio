name: Porfolio site deployer

on:
  pull_request:
    branches:
      - dev

jobs:

  # JOB 1: Install packages and build the app
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Install Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies and build the app
        run: pnpm install

      # Setting up pnpm
      - name: Build the app
        run: pnpm build
      
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: my-app-build
          path: dist/

