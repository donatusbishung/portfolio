name: Porfolio site deployer

on:
  pull_request:
    branches:
      - master

jobs:

  # JOB 1: Install packages and build the app
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Install Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '20.x'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies and build the app
        run: pnpm install

      # Setting up pnpm
      - name: Generate static app
        run: pnpm generate
      
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: my-app-build
          path: dist/

  # Job 2: Deploy to AWS S3 bucket ( deploy only for main branch )
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # if: github.ref == 'refs/heads/main'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Notify if there's failure
        if: failure()
        run: echo "Something went wrong! 🚨"